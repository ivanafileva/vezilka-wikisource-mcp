spring.datasource.url=jdbc:h2:mem:mcptool
spring.datasource.username=emc
spring.datasource.password=emc

spring.jpa.hibernate.ddl-auto=validate

jwt.secret=${JWT_SECRET_KEY:test-secret-key-please-override-in-real-runs}
jwt.expiration=864000000
jwt.header=Authorization
jwt.token-prefix=Bearer

vezilka.base-url=https://doniraj.vezilka.ai
vezilka.api-key=
vezilka.mode=export
vezilka.outbox-dir=target/vezilka-outbox-test

source.name=Wikisource (mk)
source.base-url=https://mk.wikisource.org
source.api-key=
source.user-agent=VezilkaMcpTool-tests/1.0
source.request-delay-ms=0

spring.h2.console.enabled=true
spring.h2.console.path=/h2
