spring.application.name=mcp-tool-backend

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.mk.ukim.finki.mcptoolbackend=DEBUG
logging.level.org.springframework=WARN

logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=864000000
jwt.header=Authorization
jwt.token-prefix=Bearer

vezilka.base-url=${VEZILKA_BASE_URL:https://doniraj.vezilka.ai}
vezilka.api-key=${VEZILKA_API_KEY:}
# How donations reach Vezilka:
#   export (default) - each donation is written as a Word .docx file (with
#                      provenance header) + manifest.json into vezilka.outbox-dir,
#                      ready to be uploaded by hand at https://doniraj.vezilka.ai/donate-text
#   upload           - each donation is uploaded automatically as a .docx to
#                      ${vezilka.base-url}${vezilka.upload.path}, the endpoint the site's own
#                      "Донирај текст" form uses. Anonymous (Vezilka limits anonymous
#                      uploads per day); by enabling it you donate under Vezilka's terms.
#   http             - POST JSON to ${vezilka.base-url}${vezilka.http.submit-path}
#                      with "Authorization: Bearer ${vezilka.api-key}" (for a future
#                      official API from the Vezilka team)
vezilka.mode=${VEZILKA_MODE:export}
vezilka.outbox-dir=${VEZILKA_OUTBOX_DIR:vezilka-outbox}
vezilka.upload.path=${VEZILKA_UPLOAD_PATH:/api/donations/raw-text/}
vezilka.user-agent=${VEZILKA_USER_AGENT:VezilkaMcpTool/1.0 (FINKI EMC 2026 student project)}
vezilka.http.submit-path=${VEZILKA_SUBMIT_PATH:/api/donations/text}
vezilka.http.status-path=${VEZILKA_STATUS_PATH:/api/donations/{reference}}

# MCP server (HTTP+SSE transport). The tools are reachable at /sse (stream) and
# /mcp/message (JSON-RPC). Connect the MCP Inspector or the Vezilka agent here.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=vezilka-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# The Macedonian-resource website assigned to this project:
# Vikizvor - Macedonian Wikisource (MediaWiki Action API, no key needed).
source.name=${SOURCE_NAME:\u0412\u0438\u043a\u0438\u0437\u0432\u043e\u0440 (mk.wikisource.org)}
source.base-url=${SOURCE_BASE_URL:https://mk.wikisource.org}
source.api-key=${SOURCE_API_KEY:}
# Wikimedia requires a descriptive User-Agent with contact info:
# https://meta.wikimedia.org/wiki/User-Agent_policy - put your e-mail in SOURCE_USER_AGENT.
source.user-agent=${SOURCE_USER_AGENT:VezilkaMcpTool/1.0 (FINKI EMC 2026 student project; https://doniraj.vezilka.ai)}
# Delay between consecutive page requests (be polite to Wikimedia servers).
source.request-delay-ms=${SOURCE_REQUEST_DELAY_MS:200}

spring.profiles.active=dev
